# Purano Dhun — DEVELOPMENT stack (hot reload included)
#
#   docker compose up
#
#   Frontend (Vite dev server, with /api proxied):  http://localhost:5173
#   Backend (Django runserver):                     http://localhost:8000
#
# Notes:
#   - Backend uses SQLite (backend/db.sqlite3, bind-mounted onto your host),
#     so your existing seeded data and admin account keep working.
#   - Stop any locally-run dev servers on ports 8000/5173 first (or override
#     BACKEND_PORT/FRONTEND_PORT below).
#   - Hot reload works both ways: edit code on the host, containers pick it up.

name: purano-dhun-dev

services:
  backend:
    build: ./backend
    # runserver instead of gunicorn → auto-reload on code changes
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,host.docker.internal,backend"
      # Don't force re-seed on every boot; entrypoint seeds only if DB is empty
      SEED_CATALOG: "false"

  frontend:
    image: node:22-alpine
    working_dir: /app
    # Install deps on first boot, then run Vite bound to 0.0.0.0 so the
    # published port works from the host
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      # Keep container-built node_modules out of your host checkout
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Vite dev server proxies /api and /django-admin to the backend container
      VITE_PROXY_TARGET: "http://backend:8000"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
