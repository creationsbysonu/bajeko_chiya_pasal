# Purano Dhun — PRODUCTION stack
#
#   1. cp .env.example .env   (set DJANGO_SECRET_KEY + POSTGRES_PASSWORD)
#   2. docker compose -f docker-compose.prod.yml up --build -d
#
# The app is then served on http://localhost:80 (or $HTTP_PORT):
#   - nginx serves the built React bundle and reverse-proxies /api,
#     /django-admin, /static and /media to Django (same origin → no CORS)
#   - Django runs gunicorn behind nginx, DB is PostgreSQL with a named volume
#   - On first start the catalog is auto-seeded; create the admin with:
#       docker compose -f docker-compose.prod.yml exec backend \
#         python manage.py createsuperuser
#
# When you put real HTTPS in front (certbot / cloud / PaaS), set in .env:
#   DJANGO_SSL_REDIRECT=True
#   DJANGO_ALLOWED_HOSTS=yourdomain.com
#   CORS_ALLOWED_ORIGINS=https://yourdomain.com
#   CSRF_TRUSTED_ORIGINS=https://yourdomain.com

name: purano-dhun-prod

services:
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: purano_dhun
      POSTGRES_USER: purano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purano -d purano_dhun"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    # gunicorn + WhiteNoise (collectstatic runs in the entrypoint)
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # False for plain-HTTP testing; flip to True once HTTPS terminates
      # in front of nginx (then Django sets secure cookies + HSTS)
      DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      # PostgreSQL (settings.py picks it up automatically)
      POSTGRES_DB: purano_dhun
      POSTGRES_USER: purano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
