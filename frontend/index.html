<!doctype html>
<html lang="ne" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover enables env(safe-area-inset-*) so the notch / home
         indicator never overlaps the player on modern phones.
         maximum-scale is deliberately omitted: capping the zoom violates WCAG
         1.4.4 and locks low-vision readers out of pinch-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#171614" />
    <meta name="color-scheme" content="dark" />

    <!-- Add-to-home-screen / standalone PWA hints (iOS + Android) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bajeko Chiya Pasal" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Nepali music radio and song catalog — stream timeless Nepali classics, lok dohori, rock and festival songs free. बजेको चिया पसल, नेपाली संगीत, पुराना गीत।" />
    <meta name="keywords" content="Nepali music, Nepali radio, old Nepali songs, purano nepali geet, Nepali music online, Bajeko Chiya Pasal, बजेको चिया पसल, नेपाली संगीत, पुराना नेपाली गीत, Narayan Gopal, Tara Devi, Lok Dohori, Nepathya, 1974 AD, Dashain songs, Tihar songs, Nepali song catalog" />
    <!-- Large image previews + long snippets: both are eligibility gates for
         the rich results this site qualifies for (sitelinks, FAQ, search box). -->
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <!-- Route-aware: App rewrites it on navigation (favorites is noindexed). -->
    <link rel="canonical" href="https://bajeko-chiya-pasal.vercel.app/" />

    <!-- Social previews MUST be absolute — crawlers do not resolve /og-image.png -->
    <meta property="og:title" content="Bajeko Chiya Pasal — Nepali Music Radio & Old Nepali Songs | बजेको चिया पसल" />
    <meta property="og:description" content="Nepali music radio and song catalog — stream timeless Nepali classics, lok dohori, rock and festival songs free. बजेको चिया पसल, नेपाली संगीत, पुराना गीत।" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bajeko-chiya-pasal.vercel.app/" />
    <meta property="og:site_name" content="Bajeko Chiya Pasal" />
    <meta property="og:locale" content="ne_NP" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://bajeko-chiya-pasal.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bajeko Chiya Pasal — बजेको चिया पसल, a heritage Nepali music radio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bajeko Chiya Pasal — Nepali Music Radio & Old Nepali Songs | बजेको चिया पसल" />
    <meta name="twitter:description" content="Nepali music radio and song catalog — stream timeless Nepali classics, lok dohori, rock and festival songs free. बजेको चिया पसल, नेपाली संगीत, पुराना गीत।" />
    <meta name="twitter:image" content="https://bajeko-chiya-pasal.vercel.app/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- New songs are announced here; also linked from every prerendered page. -->
    <link rel="alternate" type="application/rss+xml" title="Bajeko Chiya Pasal — new Nepali songs" href="https://bajeko-chiya-pasal.vercel.app/feed.xml" />
    <meta name="application-name" content="Bajeko Chiya Pasal" />

    <!-- Google Fonts for Nepali and English Editorial Vintage Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700;900&family=Inter:wght@300;400;500;600;700&family=Mukta:wght@300;400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">

    <title>बजेको चिया पसल | Bajeko Chiya Pasal — नेपाली संगीत रेडियो, पुराना गीत</title>

    <!-- Static structured data (identity + site search box). The screen-specific
         blocks — FAQ and the station list — are attached by src/components/JsonLd.tsx
         so they always match the copy actually rendered. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://bajeko-chiya-pasal.vercel.app/#website",
          "name": "Bajeko Chiya Pasal",
          "alternateName": ["बजेको चिया पसल", "Bajeko Chiya Pasal — Nepali Music Radio"],
          "url": "https://bajeko-chiya-pasal.vercel.app/",
          "description": "Stream timeless Nepali music through themed radio worlds — tea shop classics, vintage Radio Nepal, highway bus songs, lok dohori, rock and festival playlists.",
          "inLanguage": ["ne-NP", "en"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://bajeko-chiya-pasal.vercel.app/catalog?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://bajeko-chiya-pasal.vercel.app/#organization",
          "name": "Bajeko Chiya Pasal",
          "alternateName": "बजेको चिया पसल",
          "url": "https://bajeko-chiya-pasal.vercel.app/",
          "logo": "https://bajeko-chiya-pasal.vercel.app/icons/icon-512.png",
          "slogan": "नेपाली संगीत, पुराना सम्झना",
          "sameAs": ["https://github.com/creationsbysonu/bajeko_chiya_pasal"]
        }
      ]
    }
    </script>
  </head>
  <body class="bg-ink-900 text-cream-100 font-sans antialiased selection:bg-gold-500 selection:text-ink-950 min-h-screen">
    <!-- Accessible skip link for keyboard navigation -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-3 focus:z-50 focus:px-4 focus:py-2 focus:bg-gold-500 focus:text-ink-950 focus:font-semibold focus:rounded-md focus:shadow-lg">
      मुख्य सामग्रीमा जानुहोस् / Skip to main content
    </a>
    
    <div id="root"></div>

    <!-- Crawlers that execute JavaScript see the full catalog; this gives
         no-JS readers and older bots a real path into every collection. -->
    <noscript>
      <div style="max-width: 56rem; margin: 0 auto; padding: 2rem 1.25rem; font-family: system-ui, sans-serif; color: #e5e5e5;">
        <h1 style="font-size: 1.5rem; color: #fff;">Bajeko Chiya Pasal — बजेको चिया पसल</h1>
        <p style="color: #a3a3a3; line-height: 1.6;">
          Nepali music radio and song catalog. JavaScript is required for playback,
          but every collection can be browsed here:
        </p>
        <ul style="line-height: 1.9;">
          <li><a href="/stations" style="color: #f87171;">Radio Worlds</a></li>
          <li><a href="/catalog" style="color: #f87171;">Song Catalog</a></li>
          <li><a href="/genres" style="color: #f87171;">Music Genres</a></li>
          <li><a href="/feed.xml" style="color: #f87171;">New songs (RSS)</a></li>
          <li><a href="/sitemap.xml" style="color: #f87171;">Sitemap</a></li>
        </ul>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
