# Render Blueprint — Purano Dhun
#
# Deploy: Render dashboard → New → Blueprint → pick this repo.
# Render reads this file and creates all three resources below.
#
# ⚠️ Free-plan notes:
#   - Free web/static services spin down after ~15 min idle (first request
#     then takes ~60s to wake up).
#   - Free Postgres is TEMPORARY: Render wipes it every 90 days. For anything
#     real, set the database plan to "paid" ($7/mo) or back up often
#     (pg_dump cron / Render's scheduled backups on paid plans).
#
# After first deploy:
#   1. Create the admin:
#        Dashboard → purano-dhun-api → Shell →
#        python manage.py createsuperuser
#   2. Log in at your static site → प्रशासक पोर्टल → change the password
#      to something ≥10 characters (Security tab).
#   3. If you rename the services below, update the two onrender.com URLs
#      in envVars to match your actual service hostnames.

databases:
  - name: purano-dhun-db
    plan: free # switch to "paid" for persistent storage (see warning above)
    databaseName: purano_dhun

services:
  # --- Django API (gunicorn, from backend/Dockerfile) ---
  - type: web
    name: purano-dhun-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates and stores a secure key
      - key: DJANGO_DEBUG
        value: "False"
      # Render terminates TLS and forwards X-Forwarded-Proto, which Django
      # honors via SECURE_PROXY_SSL_HEADER (see settings.py)
      - key: DJANGO_SSL_REDIRECT
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: purano-dhun-api.onrender.com
      # Same-origin policy for the API: only the static site may call it.
      # Update these two if you rename the static site service.
      - key: CORS_ALLOWED_ORIGINS
        value: https://purano-dhun.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://purano-dhun.onrender.com
      # Managed Postgres connection (settings.py switches off SQLite on this)
      - key: DATABASE_URL
        fromDatabase:
          name: purano-dhun-db
          property: connectionString

  # --- React SPA (Vite build, served as a Render static site) ---
  - type: web
    name: purano-dhun
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Baked into the bundle at build time; api.ts falls back to the
      # same-origin "/api" proxy used in local development.
      - key: VITE_API_BASE
        value: https://purano-dhun-api.onrender.com/api
