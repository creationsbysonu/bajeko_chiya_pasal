# CI for Purano Dhun — runs on every push to main and on pull requests.
# Two gates:
#   1. Supabase SQL: migrations + seed applied to an in-process Postgres
#      (PGlite) and every public/admin RPC exercised with role switching
#   2. Frontend:   Vitest suite + production TypeScript/Vite build
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  supabase-sql:
    name: Supabase SQL + RPC tests (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/package-lock.json

      - name: Install harness dependencies
        working-directory: supabase
        run: npm ci

      - name: Run migrations + RPC test suite
        working-directory: supabase
        run: npm run verify

  frontend-tests:
    name: Frontend tests + build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run test suite
        working-directory: frontend
        run: npm run test -- --run

      - name: Production build
        working-directory: frontend
        run: npm run build
