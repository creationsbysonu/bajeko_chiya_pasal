# CI for Purano Dhun — runs on every push to main and on pull requests.
# Three gates:
#   1. Backend:  Django test suite (SQLite test DB, no external services)
#   2. Frontend: Vitest suite + production TypeScript/Vite build
#   3. Docker:   both images (dev compose + prod compose) must still build
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run test suite
        working-directory: backend
        run: python manage.py test radio_core

  frontend-tests:
    name: Frontend tests + build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run test suite
        working-directory: frontend
        run: npm run test -- --run

      - name: Production build
        working-directory: frontend
        run: npm run build

  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev images
        run: docker compose build

      # The prod file requires secrets via :? guards — provide throwaway
      # values so the build itself is still validated on every push.
      - name: Build prod images
        env:
          DJANGO_SECRET_KEY: ci-build-only-not-a-real-secret
          POSTGRES_PASSWORD: ci-build-only-not-a-real-password
        run: docker compose -f docker-compose.prod.yml build
