# Keep dependencies and CI actions current without noisy PRs.
# Dependabot opens grouped weekly updates; CI must pass before merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /supabase
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      supabase-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
